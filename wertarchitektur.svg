<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 420" role="img" aria-labelledby="wa-t wa-d" font-family="Poppins, Arial, sans-serif">
  <title id="wa-t">Die KI-Wertarchitektur von StrategiemitKI</title>
  <desc id="wa-d">Sechs Ebenen: Wert als Dach, Abläufe, Intelligenz und Daten als tragende Säulen, Mensch und Steuerung als Fundament.</desc>
  <!-- Dach: WERT -->
  <path d="M380 18 L728 118 L32 118 Z" fill="#F2A33A"/>
  <text x="380" y="78" text-anchor="middle" font-size="26" font-weight="700" fill="#0F2340">WERT</text>
  <text x="380" y="103" text-anchor="middle" font-size="13.5" fill="#0F2340">Wo entsteht wirtschaftlicher Nutzen?</text>
  <!-- Säulen -->
  <g>
    <rect x="58" y="134" width="200" height="140" rx="10" fill="#4DB9A5"/>
    <text x="158" y="182" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">ABLÄUFE</text>
    <text x="158" y="214" text-anchor="middle" font-size="13" fill="#fff">Welche Prozesse</text>
    <text x="158" y="233" text-anchor="middle" font-size="13" fill="#fff">und Engpässe?</text>
  </g>
  <g>
    <rect x="280" y="134" width="200" height="140" rx="10" fill="#14A38B"/>
    <text x="380" y="182" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">INTELLIGENZ</text>
    <text x="380" y="214" text-anchor="middle" font-size="13" fill="#fff">Welche Aufgabe</text>
    <text x="380" y="233" text-anchor="middle" font-size="13" fill="#fff">übernimmt die KI?</text>
  </g>
  <g>
    <rect x="502" y="134" width="200" height="140" rx="10" fill="#0E7F6C"/>
    <text x="602" y="182" text-anchor="middle" font-size="21" font-weight="700" fill="#fff">DATEN</text>
    <text x="602" y="214" text-anchor="middle" font-size="13" fill="#fff">Welche Daten</text>
    <text x="602" y="233" text-anchor="middle" font-size="13" fill="#fff">und welches Wissen?</text>
  </g>
  <!-- Fundament -->
  <rect x="32" y="290" width="696" height="52" rx="10" fill="#1E3A5F"/>
  <text x="66" y="323" font-size="19" font-weight="700" fill="#fff">MENSCH</text>
  <text x="200" y="323" font-size="13.5" fill="#C8D3E0">Wer arbeitet wie mit KI – und trägt Verantwortung?</text>
  <rect x="32" y="352" width="696" height="52" rx="10" fill="#0F2340"/>
  <text x="66" y="385" font-size="19" font-weight="700" fill="#fff">STEUERUNG</text>
  <text x="200" y="385" font-size="13.5" fill="#C8D3E0">Welche Regeln, Kennzahlen und Kontrollen sichern den Erfolg?</text>
</svg>
